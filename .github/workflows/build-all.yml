name: Build & Release NeXTycoon Multi-Platform

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, Win32]
        include:
          - platform: x64
            pkg_name: windows-x64
          - platform: Win32
            pkg_name: windows-x86

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build NeXTycoon Release
        run: |
          msbuild openrct2.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m /v:m

      - name: Download Full Game Assets
        run: |
          python scripts/download-game-assets.py bin/data

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $pkgDir = "NeXTycoon-v1.1.0-${{ matrix.pkg_name }}"
          New-Item -ItemType Directory -Path $pkgDir
          Copy-Item -Path "bin\NeXTycoon.exe" -Destination "$pkgDir\NeXTycoon.exe"
          Copy-Item -Path "bin\NeXTycoon-cli.exe" -Destination "$pkgDir\NeXTycoon-cli.exe"
          Copy-Item -Path "bin\*.dll" -Destination $pkgDir\ -ErrorAction SilentlyContinue
          Copy-Item -Path "bin\data" -Destination "$pkgDir\data" -Recurse
          if (Test-Path "bin\plugins") {
              Copy-Item -Path "bin\plugins" -Destination "$pkgDir\plugins" -Recurse
          }
          New-Item -ItemType Directory -Path "$pkgDir\include" -Force | Out-Null
          if (Test-Path "src\openrct2\scripting\nextycoon_api.h") {
              Copy-Item -Path "src\openrct2\scripting\nextycoon_api.h" -Destination "$pkgDir\include\"
          }
          Copy-Item -Path "readme.md" -Destination "$pkgDir\"
          Copy-Item -Path "contributors.md" -Destination "$pkgDir\"
          Copy-Item -Path "licence.txt" -Destination "$pkgDir\"
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "$pkgDir.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeXTycoon-v1.1.0-${{ matrix.pkg_name }}
          path: NeXTycoon-v1.1.0-${{ matrix.pkg_name }}.zip

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsdl2-dev \
            libvulkan-dev \
            libcurl4-openssl-dev \
            libspeexdsp-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libzip-dev \
            libssl-dev \
            zlib1g-dev \
            libflac-dev \
            libvorbis-dev \
            libicu-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISABLE_DISCORD=ON

      - name: Build NeXTycoon Linux
        run: |
          ninja -C build

      - name: Download Full Game Assets
        run: |
          python3 scripts/download-game-assets.py data

      - name: Package Linux Binary Tarball
        run: |
          PKG_NAME="NeXTycoon-v1.1.0-linux-x86_64"
          mkdir -p "$PKG_NAME"
          if [ -f "build/NeXTycoon" ]; then
            cp build/NeXTycoon "$PKG_NAME/NeXTycoon"
          else
            cp build/openrct2 "$PKG_NAME/NeXTycoon"
          fi
          if [ -f "build/NeXTycoon-cli" ]; then
            cp build/NeXTycoon-cli "$PKG_NAME/NeXTycoon-cli"
          else
            cp build/openrct2-cli "$PKG_NAME/NeXTycoon-cli"
          fi
          cp -r data "$PKG_NAME/"
          if [ -f "build/g2.dat" ]; then cp build/g2.dat "$PKG_NAME/data/"; fi
          if [ -f "build/fonts.dat" ]; then cp build/fonts.dat "$PKG_NAME/data/"; fi
          if [ -f "build/palettes.dat" ]; then cp build/palettes.dat "$PKG_NAME/data/"; fi
          if [ -f "build/tracks.dat" ]; then cp build/tracks.dat "$PKG_NAME/data/"; fi
          mkdir -p "$PKG_NAME/include"
          if [ -f "src/openrct2/scripting/nextycoon_api.h" ]; then
            cp "src/openrct2/scripting/nextycoon_api.h" "$PKG_NAME/include/"
          fi
          cp readme.md contributors.md licence.txt "$PKG_NAME/"
          tar -czvf "$PKG_NAME.tar.gz" "$PKG_NAME"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeXTycoon-v1.1.0-linux-x86_64
          path: NeXTycoon-v1.1.0-linux-x86_64.tar.gz

  build-macos:
    name: macOS (Universal / Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS Dependencies
        run: |
          brew install cmake ninja sdl2 libpng freetype fontconfig speexdsp libzip flac libvorbis icu4c openssl molten-vk

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DDISABLE_DISCORD=ON

      - name: Build NeXTycoon macOS
        run: |
          ninja -C build

      - name: Download Full Game Assets
        run: |
          python3 scripts/download-game-assets.py data

      - name: Package macOS App Bundle
        run: |
          PKG_NAME="NeXTycoon-v1.1.0-macos-universal"
          mkdir -p "$PKG_NAME"
          APP_BUNDLE=""
          if [ -d "build/NeXTycoon.app" ]; then
            APP_BUNDLE="build/NeXTycoon.app"
          elif [ -d "build/OpenRCT2.app" ]; then
            APP_BUNDLE="build/OpenRCT2.app"
          fi

          if [ -n "$APP_BUNDLE" ]; then
            cp -r "$APP_BUNDLE" "$PKG_NAME/NeXTycoon.app"
            mkdir -p "$PKG_NAME/NeXTycoon.app/Contents/Resources/data"
            cp -r data/* "$PKG_NAME/NeXTycoon.app/Contents/Resources/data/" 2>/dev/null || true
            if [ -f "build/g2.dat" ]; then cp build/g2.dat "$PKG_NAME/NeXTycoon.app/Contents/Resources/data/" 2>/dev/null || true; fi
            if [ -f "build/fonts.dat" ]; then cp build/fonts.dat "$PKG_NAME/NeXTycoon.app/Contents/Resources/data/" 2>/dev/null || true; fi
            if [ -f "build/palettes.dat" ]; then cp build/palettes.dat "$PKG_NAME/NeXTycoon.app/Contents/Resources/data/" 2>/dev/null || true; fi
            if [ -f "build/tracks.dat" ]; then cp build/tracks.dat "$PKG_NAME/NeXTycoon.app/Contents/Resources/data/" 2>/dev/null || true; fi
          else
            if [ -f "build/NeXTycoon" ]; then cp build/NeXTycoon "$PKG_NAME/NeXTycoon"; else cp build/openrct2 "$PKG_NAME/NeXTycoon"; fi
            if [ -f "build/NeXTycoon-cli" ]; then cp build/NeXTycoon-cli "$PKG_NAME/NeXTycoon-cli"; else cp build/openrct2-cli "$PKG_NAME/NeXTycoon-cli"; fi
            cp -r data "$PKG_NAME/"
            if [ -f "build/g2.dat" ]; then cp build/g2.dat "$PKG_NAME/data/"; fi
            if [ -f "build/fonts.dat" ]; then cp build/fonts.dat "$PKG_NAME/data/"; fi
            if [ -f "build/palettes.dat" ]; then cp build/palettes.dat "$PKG_NAME/data/"; fi
            if [ -f "build/tracks.dat" ]; then cp build/tracks.dat "$PKG_NAME/data/"; fi
          fi
          mkdir -p "$PKG_NAME/include"
          if [ -f "src/openrct2/scripting/nextycoon_api.h" ]; then
            cp "src/openrct2/scripting/nextycoon_api.h" "$PKG_NAME/include/"
          fi
          cp readme.md contributors.md licence.txt "$PKG_NAME/"
          zip -r "$PKG_NAME.zip" "$PKG_NAME"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeXTycoon-v1.1.0-macos-universal
          path: NeXTycoon-v1.1.0-macos-universal.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## NeXTycoon Multi-Platform Release (${{ github.ref_name }})
          
          ### 🚀 Highlights & Features
          - **Modern Hardware Rendering**: Primary hardware acceleration powered by **Vulkan** and **OpenGL 3.3+**, with ultra-compatible **Software** blit and optional Direct3D 11/9.
          - **Universal Multi-Platform Binaries**: Standalone portable builds for Windows 64-bit (`x64`), Windows 32-bit (`x86`), Linux (`x86_64`), and macOS Universal (`arm64` Apple Silicon & `x86_64` Intel).
          - **Full Game Data Included**: Complete objects library, asset packs, `g2.dat`, `tracks.dat`, fonts, palettes, scenario patches, sequence, shaders, and language packs (80MB+ full packages).
          - **Multi-Language Plugin Architecture**: Native support for **JavaScript**, **TypeScript**, **Lua 5.4**, and **C-ABI Native Dynamic Libraries (.dll / .so / .dylib)**. Includes Wall Street Stock Exchange plugin sample (`NeXTycoonWallStreet.dll`).
          - **Picture-in-Picture Coaster-Cam**: Real-time broadcast telemetry HUD (G-forces, velocity, altitude) with smear-free viewport docking.
          - **Enhanced Compression**: Zstandard stream optimization eliminating network multiplayer map sync errors.
          - **Console Cleanliness**: Zero spurious CLI/terminal popups on desktop execution.
          EOF
          gh release edit ${{ github.ref_name }} --notes-file release_notes.md || true
          gh release upload ${{ github.ref_name }} release-assets/* --clobber || \
          gh release create ${{ github.ref_name }} release-assets/* \
            --title "NeXTycoon ${{ github.ref_name }} - Multi-Platform Cross-Engine Release" \
            --notes-file release_notes.md
